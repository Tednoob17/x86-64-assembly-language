name: Deploy mdBook

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('**/Cargo.lock') }}-${{ runner.os }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install mdbook-quiz preprocessor
        run: cargo install mdbook-quiz --locked

      # --- mdBook itself ------------------------------------------------------
      - name: Install mdBook
        run: cargo install mdbook --locked

      - name: Build book
        run: mdbook build

      - name: Deploy to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/gh-pages

          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            git worktree add -B gh-pages /tmp/gh-pages origin/gh-pages
          else
            git worktree add --detach /tmp/gh-pages
            git -C /tmp/gh-pages switch --orphan gh-pages
            git -C /tmp/gh-pages rm -rf .
          fi

          rsync -a --delete --exclude '.git' book/ /tmp/gh-pages/
          git -C /tmp/gh-pages add -A

          if git -C /tmp/gh-pages diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git -C /tmp/gh-pages commit -m "Deploy book"
            git -C /tmp/gh-pages push origin gh-pages
          fi

          
